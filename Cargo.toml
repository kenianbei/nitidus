[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kenianbei/nitidus"

[workspace.dependencies]
nitidus-contacts = { path = "crates/nitidus-contacts" }
nitidus-mail = { path = "crates/nitidus-mail" }
nitidus-ui-kit = { path = "crates/nitidus-ui-kit" }

ammonia = "4.1"
anyhow = "1"
bevy = { version = "0.18", default-features = false, features = [
  "bevy_log",
  "bevy_state",
] }
bevy_ratatui = "0.11"
bevy-trait-query = "0.18"
crokey = "1.4"
etcetera = "0.11"
flume = "0.12"
html2text = "0.17"
image = "0.25"
io-imap = { version = "0.2", default-features = false }
io-smtp = { version = "0.2", default-features = false }
jiff = "0.2"
mail-builder = "0.4"
mail-parser = "0.11"
notify = "8"
nucleo-matcher = "0.3"
plurimus = { version = "0.1", features = ["ui", "tachyonfx"] }
ratatui = { version = "0.30", features = [
  "crossterm",
  "palette",
  "unstable-widget-ref",
] }
ratatui-comfy-toaster = "0.6"
ratatui-image = "11"
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.6"
serde = { version = "1", features = ["derive"] }
tachyonfx = "0.25"
tempfile = "3"
thiserror = "2"
textwrap = "0.16"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "process"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-util = "0.7"
toml = "1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tui-prompts = "0.6"
utf7-imap = "0.3"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
# ECS system signatures routinely exceed the default complexity budget;
# bevy's own codebase carries this same allow.
type_complexity = "allow"
