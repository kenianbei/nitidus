# Invariant: bevy must never appear in this crate's dependency tree. The
# mail engine runs on its own tokio runtime and stays testable and
# insulated from UI-framework churn.

[package]
name = "nitidus-mail"
description = "Mail engine and backend abstraction for nitidus"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
mock = []

[dependencies]
flume.workspace = true
mail-parser.workspace = true
notify.workspace = true
rusqlite.workspace = true
rusqlite_migration.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "time"] }
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
nitidus-mail = { path = ".", features = ["mock"] }
rusqlite.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros"] }

[lints]
workspace = true
